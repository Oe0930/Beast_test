[platformio]
default_envs = BNO055_test

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>
board_build.embed_txtfiles = data/index.html

[env:yellow_motor_test]
extends = env:esp32dev
build_src_filter = +<yellowMotorTest.cpp>

[env:BNO055_test]
extends = env:esp32dev
build_src_filter = +<BNO055Test.cpp>
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor

[env:LSM6DSV16X_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<LSM6DSV16XTest.cpp>
lib_deps = sparkfun/SparkFun 6DoF LSM6DSV16X@1.0.2

[env:pendrum]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<pendrum.cpp>
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor

[env:radiconGUI]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<radiconGUI.cpp>
board_build.embed_txtfiles = data/index-radicon.html
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor


[env:gyroTurn]
platform = espressif32
